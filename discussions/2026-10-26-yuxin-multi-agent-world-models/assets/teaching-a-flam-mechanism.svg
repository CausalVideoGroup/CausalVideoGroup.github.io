<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 446" width="1440" height="446" role="img"><title>FLAM simplified training example</title><desc>Simplified explanatory flow based on FLAM. Colors do not imply supervised identities or guaranteed factor-agent alignment.</desc><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}line,path,rect{stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="440" height="420" rx="14" fill="#f1f6f2" stroke="#cbdad5" stroke-width="2"/><text x="32" y="50" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">训练输入：前后视频帧</text><rect x="35" y="88" width="390" height="125" rx="14" fill="white" stroke="#cbdad5" stroke-width="2"/><g transform="translate(140,158) scale(0.52)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(320,158) scale(0.52)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><text x="58" y="127" font-size="26" fill="#5b6d74" font-weight="400" text-anchor="start">前</text><rect x="35" y="236" width="390" height="125" rx="14" fill="white" stroke="#cbdad5" stroke-width="2"/><g transform="translate(95,306) scale(0.52)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fil