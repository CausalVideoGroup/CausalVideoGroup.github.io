" height="66" rx="8" fill="#ffffff" stroke="#ce7735" stroke-width="2"/><text x="822.0" y="283.0" font-size="28" fill="#ce7735" font-weight="650" text-anchor="middle">z₂</text><text x="717" y="362" font-size="27" fill="#5b6d74" font-weight="400" text-anchor="middle">前后对应的表示</text><text x="717" y="396" font-size="27" fill="#5b6d74" font-weight="400" text-anchor="middle">用于推断各自的 z</text><line x1="925" y1="220" x2="957.0" y2="220.0" stroke="#5b6d74" stroke-width="3"/><polygon points="970,220 957.0,226.0 957.0,214.0" fill="#5b6d74"/><rect x="985" y="10" width="445" height="420" rx="14" fill="#f1f6f2" stroke="#cbdad5" stroke-width="2"/><text x="1007" y="50" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">一起预测下一帧</text><rect x="1009" y="82" width="396" height="58" rx="8" fill="#ffffff" stroke="#398c77" stroke-width="2"/><text x="1207.0" y="121.0" font-size="28" fill="#398c77" font-weight="650" text-anchor="middle">当前场景 + z₁、z₂</text><g transform="translate(1105,254) scale(0.92)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(1302,212) scale(0.92)" opacity="1"><path d="M-25,-5 L-45,-32 M25,-5 L45,-32 M-13,35 L-34,51 M13,35 L34,51" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><line x1="1015" y1="320" x2="1400" y2="320" stroke="#cbdad5" stroke-width="3"/><text x="1207" y="388" font-size="27" fill="#5b6d74" font-weight="400" text-anchor="middle">输出仍是一幅完整画面</text></svg>