<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" role="img"><title>Gamma-World身份池与共享hub的示意</title><desc>依据Gamma-World方法自绘，身份池仅展示六个抽象编码并非固定数量。各主体的独立输入与输出通过共享hub交换信息，不是平均成相同视频。</desc><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}line,path,rect{stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><rect x="15" y="12" width="1410" height="100" rx="14" fill="#f4f7f4" stroke="#cbdad5" stroke-width="2"/><text x="37" y="52" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">预设身份池：为各主体分配不同编码</text><rect x="800" y="40" width="74" height="52" rx="8" fill="#ffffff" stroke="#5b6d74" stroke-width="2"/><text x="837.0" y="76.0" font-size="28" fill="#5b6d74" font-weight="650" text-anchor="middle">e1</text><rect x="894" y="40" width="74" height="52" rx="8" fill="#ffffff" stroke="#5b6d74" stroke-width="2"/><text x="931.0" y="76.0" font-size="28" fill="#5b6d74" font-weight="650" text-anchor="middle">e2</text><rect x="988" y="40" width="74" height="52" rx="8" fill="#ffffff" stroke="#5b6d74" stroke-width="2"/><text x="1025.0" y="76.0" font-size="28" fill="#5b6d74" font-weight="650" text-anchor="middle">e3</text><rect x="1082" y="40" width="74" height="52" rx="8" fill="#ffffff" stroke="#5b6d74" stroke-width="2"/><text x="1119.0" y="76.0" font-size="28" fill="#5b6d74" font-weight="650" text-anchor="middle">e4</text><rect x="1176" y="40" width="74" height="52" rx="8" fill="#ffffff" stroke="#5b6d74" stroke-width="2"/><text x="1213.0" y="76.0" font-size="28" fill="#5b6d74" font-weight="650" text-anchor="middle">e5</text><rect x="1270" y="40" width="74" height="52" rx="8" fill="#ffffff" stroke="#5b6d74" stroke-width="2"/><text x="1307.0" y="76.0" font-size="28" fill="#5b6d74" font-weight="650" text-anchor="middle">e6</text><text x="40" y="90" font-size="25" fill="#5b6d74" font-weight="400" text-anchor="start">训练随机分配；更多主体用更多编码（6个仅为示意）。</text><line x1="181" y1="118" x2="181.0" y2="133.0" stroke="#2876a5" stroke-width="3"/><polygon points="181,146 175.0,133.0 187.0,133.0" fill="#2876a5"/><rect x="25" y="153" width="315" height="217" rx="14" fill="white" stroke="#2876a5" stroke-width="2"/><text x="47" y="193" font-size="30" fill="#2876a5" font-weight="700" text-anchor="start">A：身份 e3</text><text x="182" y="236" font-size="27" fill="#2876a5" font-weight="600" text-anchor="middle">自己的观察＋开门</text><line x1="182" y1="254" x2="182.0" y2="269.0" stroke="#2876a5" stroke-width="3"/><polygon points="182,282 176.0,269.0 188.0,269.0" fill="#2876a5"/><text x="182" y="325" font-size="29" fill="#2876a5" font-weight="650" text-anchor="middle">A的后续视频</text><line x1="167" y1="375" x2="167.0" y2="401.0" stroke="#2876a5" stroke-width="3"/><polygon points="167,414 161.0,401.0 173.0,401.0" fill="#2876a5"/><line x1="197" y1="414" x2="197.0" y2="388.0" stroke="#2876a5" stroke-width="3"/><polygon points="197,375 203.0,388.0 191.0,388.0" fill="#2876a5"/><line x1="538" y1="118" x2="538.0" y2="133.0" stroke="#ce7735" stroke-width="3"/><polygon points="538,146 532.0,133.0 544.0,133.0" fill="#ce7735"/><rect x="382" y="153" width="315" height="217" rx="14" fill="white" stroke="#ce7735" stroke-width="2"/><text x="404" y="193" font-size="30" fill="#ce7735" font-weight="700" text-anchor="start">B：身份 e1</text><text x="539" y="236" font-size="27" fill="#ce7735" font-weight="600" text-anchor="middle">自己的观察＋移动</text><line x1="539" y1="254" x2="539.0" y2="269.0" stroke="#ce7735" stroke-width="3"/><polygon points="539,282 533.0,269.0 545.0,269.0" fill="#ce7735"/><text x="539" y="325" font-size="29" fill="#ce7735" font-weight="650" text-anchor="middle">B的后续视频</text><line x1="524" y1="375" x2="524.0" y2="401.0" stroke="#ce7735" stroke-width="3"/><polygon points="524,414 518.0,401.0 530.0,401.0" fill="#ce7735"/><line x1="554" y1="414" x2="554.0" y2="388.0" stroke="#ce7735" stroke-width="3"/><polygon points="554,375 560.0,388.0 548.0,388.0" fill="#ce7735"/><line x1="895" y1="118" x2="895.0" y2="133.0" stroke="#8263ae" stroke-width="3"/><polygon points="895,146 889.0,133.0 901.0,133.0" fill="#8263ae"/><rect x="739" y="153" width="315" height="217" rx="14" fill="white" stroke="#8263ae" stroke-width="2"/><text x="761" y="193" font-size="30" fill="#8263ae" font-weight="700" text-anchor="start">C：身份 e6</text><text x="896" y="236" font-size="27" fill="#8263ae" font-weight="600" text-anchor="middle">自己的观察＋转身</text><line x1="896" y1="254" x2="896.0" y2="269.0" stroke="#8263ae" stroke-width="3"/><polygon points="896,282 890.0,269.0 902.0,269.0" fill="#8263ae"/><text x="896" y="325" font-size="29" fill="#8263ae" font-weight="650" text-anchor="middle">C的后续视频</text><line x1="881" y1="375" x2="881.0" y2="401.0" stroke="#8263ae" stroke-width="3"/><polygon points="881,414 875.0,401.0 887.0,401.0" fill="#8263ae"/><line x1="911" y1="414" x2="911.0" y2="388.0" stroke="#8263ae" stroke-width="3"/><polygon points="911,375 917.0,388.0 905.0,388.0" fill="#8263ae"/><line x1="1252" y1="118" x2="1252.0" y2="133.0" stroke="#398c77" stroke-width="3"/><polygon points="1252,146 1246.0,133.0 1258.0,133.0" fill="#398c77"/><rect x="1096" y="153" width="315" height="217" rx="14" fill="white" stroke="#398c77" stroke-width="2"/><text x="1118" y="193" font-size="30" fill="#398c77" font-weight="700" text-anchor="start">D：身份 e4</text><text x="1253" y="236" font-size="27" fill="#398c77" font-weight="600" text-anchor="middle">自己的观察＋抬头</text><line x1="1253" y1="254" x2="1253.0" y2="269.0" stroke="#398c77" stroke-width="3"/><polygon points="1253,282 1247.0,269.0 1259.0,269.0" fill="#398c77"/><text x="1253" y="325" font-size="29" fill="#398c77" font-weight="650" text-anchor="middle">D的后续视频</text><line x1="1238" y1="375" x2="1238.0" y2="401.0" stroke="#398c77" stroke-width="3"/><polygon points="1238,414 1232.0,401.0 1244.0,401.0" fill="#398c77"/><line x1="1268" y1="414" x2="1268.0" y2="388.0" stroke="#398c77" stroke-width="3"/><polygon points="1268,375 1274.0,388.0 1262.0,388.0" fill="#398c77"/><rect x="15" y="425" width="1410" height="76" rx="12" fill="#eef6f0" stroke="#398c77" stroke-width="2"/><text x="720" y="458" font-size="30" fill="#398c77" font-weight="700" text-anchor="middle">共享 hub：少量共享表示，交换跨主体信息</text><text x="720" y="489" font-size="25" fill="#5b6d74" font-weight="400" text-anchor="middle">生成过程中交换信息，各人仍保留自己的表示与输出。</text></svg>