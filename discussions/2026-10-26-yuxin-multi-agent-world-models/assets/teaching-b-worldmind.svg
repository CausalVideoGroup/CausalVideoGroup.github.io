<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="teaching-b-worldmind.svg"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#61797e"/></marker></defs><rect width="1440" height="520" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="30" fill="#8263ae" font-weight="700" text-anchor="start">1  形成当前状态</text><rect x="28" y="60" width="300" height="181" rx="12" fill="#f7fafb" stroke="#d8e1df" stroke-width="2"/><path d="M46 199 L310 199" fill="none" stroke="#b9cecf" stroke-width="3" stroke-linecap="round"/><g transform="translate(148.0,186) scale(0.92)"><circle cx="0" cy="-78" r="16" fill="#2876a5"/><path d="M0 -60 L0 -28 M0 -45 L-24 -33 M0 -45 L24 -33 M0 -28 L-18 0 M0 -28 L18 0" stroke="#2876a5" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#2876a5" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(244.0,186) scale(0.92)"><circle cx="0" cy="-78" r="16" fill="#ce7735"/><path d="M0 -60 L0 -28 M0 -45 L-24 -33 M0 -45 L24 -33 M0 -28 L-18 0 M0 -28 L18 0" stroke="#ce7735" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#ce7735" font-weight="700" text-anchor="middle">B</text></g><path d="M103.0 87 L163.0 87" fill="none" stroke="#2876a5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="178" y="276" font-size="25" fill="#172e39" font-weight="600" text-anchor="middle">从画面估计：双方接近</text><rect x="28" y="303" width="300" height="104" rx="10" fill="#fff5e8" stroke="#d8e1df" stroke-width="2"/><text x="178" y="340" font-size="26" fill="#ce7735" font-weight="700" text-anchor="middle">从动作记录计算</text><text x="178" y="380" font-size="25" fill="#5b6d74" font-weight="500" text-anchor="middle">例：冲刺还需冷却</text><path d="M350 225 L400 225" fill="none" stroke="#5b6d74" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="432" y="40" font-size="30" fill="#8263ae" font-weight="700" text-anchor="start">2  显式选 NPC 动作</text><rect x="431" y="99" width="287" height="259" rx="16" fill="#f8f5fc" stroke="#d8e1df" stroke-width="2"/><text x="574" y="150" font-size="27" fill="#172e39" font-weight="600" text-anchor="middle">状态 + 技能说明</text><text x="574" y="200" font-size="28" fill="#8263ae" font-weight="700" text-anchor="middle">语言模型决策</text><rect x="451" y="256" width="247" height="44" rx="22" fill="#fff1df" stroke="none" stroke-width="2"/><text x="574.5" y="287" font-size="25" fill="#ce7735" font-weight="600" text-anchor="middle">示意：B 后退</text><path d="M737 225 L787 225" fill="none" stroke="#5b6d74" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="811" y="40" font-size="30" fill="#8263ae" font-weight="700" text-anchor="start">3  对齐时间</text><rect x="812" y="99" width="232" height="259" rx="16" fill="#f5f9fc" stroke="#d8e1df" stroke-width="2"/><rect x="833" y="158" width="39" height="59" rx="5" fill="#e4eef8" stroke="#2876a5" stroke-width="2"/><text x="852" y="197" font-size="24" fill="#2876a5" font-weight="600" text-anchor="middle">1</text><rect x="882" y="158" width="39" height="59" rx="5" fill="#e4eef8" stroke="#2876a5" stroke-width="2"/><text x="901" y="197" font-size="24" fill="#2876a5" font-weight="600" text-anchor="middle">2</text><rect x="931" y="158" width="39" height="59" rx="5" fill="#e4eef8" stroke="#2876a5" stroke-width="2"/><text x="950" y="197" font-size="24" fill="#2876a5" font-weight="600" text-anchor="middle">3</text><rect x="980" y="158" width="39" height="59" rx="5" fill="#e4eef8" stroke="#2876a5" stroke-width="2"/><text x="999" y="197" font-size="24" fill="#2876a5" font-weight="600" text-anchor="middle">4</text><text x="928" y="259" font-size="25" fill="#172e39" font-weight="600" text-anchor="middle">动作 → 生成条件</text><text x="928" y="302" font-size="24" fill="#5b6d74" font-weight="500" text-anchor="middle">在哪段时间执行</text><path d="M1062 225 L1100 225" fill="none" stroke="#5b6d74" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1124" y="40" font-size="30" fill="#8263ae" font-weight="700" text-anchor="start">4  生成视频</text><rect x="1121" y="99" width="291" height="210" rx="12" fill="#f7fafb" stroke="#d8e1df" stroke-width="2"/><path d="M1139 267 L1394 267" fill="none" stroke="#b9cecf" stroke-width="3" stroke-linecap="round"/><g transform="translate(1243.22,254) scale(0.92)"><circle cx="0" cy="-78" r="16" fill="#2876a5"/><path d="M0 -60 L0 -28 M0 -45 L-22 -28 M0 -45 L40 -45 M0 -28 L-20 0 M0 -28 L22 0" stroke="#2876a5" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#2876a5" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(1350.89,254) scale(0.92)"><circle cx="12" cy="-78" r="16" fill="#ce7735"/><path d="M9 -60 L0 -28 M5 -45 L-20 -35 M5 -45 L31 -26 M0 -28 L-18 0 M0 -28 L20 0" stroke="#ce7735" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#ce7735" font-weight="700" text-anchor="middle">B</text></g><path d="M1310.15 126 L1362.53 126" fill="none" stroke="#ce7735" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1266" y="352" font-size="25" fill="#ce7735" font-weight="600" text-anchor="middle">执行 B 的动作</text><path d="M1266 387 L1266 448 L178 448 L178 424" stroke="#61797e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="482" y="427" width="554" height="42" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="759" y="457" font-size="25" fill="#5b6d74" font-weight="600" text-anchor="middle">新画面 + 新动作记录 → 下一轮状态</text><text x="1420" y="506" font-size="24" fill="#5b6d74" font-weight="500" text-anchor="end">原创教学示意 · 技能与动作是假设例子；几何估计和技能记录来源不同</text></g></svg>