<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" width="1440" height="450" role="img"><title>Action binding task example</title><desc>Illustrative example; not a reported experiment.</desc><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}line,path,rect{stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><rect x="10" y="15" width="400" height="350" rx="14" fill="#ffffff" stroke="#cbdad5" stroke-width="2"/><text x="32" y="55" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">给定：A 左移，B 右移</text><line x1="38" y1="313" x2="382" y2="313" stroke="#cbdad5" stroke-width="3"/><g transform="translate(134.0,253) scale(0.78)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(298.0,253) scale(0.78)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><rect x="37" y="80" width="160" height="57" rx="8" fill="#ffffff" stroke="#2876a5" stroke-width="2"/><text x="117.0" y="118.5" font-size="28" fill="#2876a5" font-weight="650" text-anchor="middle">A ←</text><rect x="223" y="80" width="160" height="57" rx="8" fill="#ffffff" stroke="#ce7735" stroke-width="2"/><text x="303.0" y="118.5" font-size="28" fill="#ce7735" font-weight="650" text-anchor="middle">B →</text><line x1="426" y1="190" x2="461.0" y2="190.0" stroke="#5b6d74" stroke-width="3"/><polygon points="474,190 461.0,196.0 461.0,184.0" fill="#5b6d74"/><rect x="490" y="15" width="450" height="350" rx="14" fill="#ffffff" stroke="#cbdad5" stroke-width="2"/><text x="512" y="55" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">目标：各做各的动作</text><line x1="518" y1="313" x2="912" y2="313" stroke="#cbdad5" stroke-width="3"/><g transform="translate(629.5,253) scale(0.78)" opacity=".22"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(574.5,253) scale(0.78)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><line x1="627.5" y1="176" x2="587.5" y2="176.0" stroke="#2876a5" stroke-width="3"/><polygon points="574.5,176 587.5,170.0 587.5,182.0" fill="#2876a5"/><g transform="translate(814.0,253) scale(0.78)" opacity=".22"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><g transform="translate(862.0,253) scale(0.78)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><line x1="814.0" y1="176" x2="849.0" y2="176.0" stroke="#ce7735" stroke-width="3"/><polygon points="862.0,176 849.0,182.0 849.0,170.0" fill="#ce7735"/><rect x="970" y="15" width="460" height="350" rx="14" fill="#fff6f2" stroke="#dfc9c1" stroke-width="2"/><text x="992" y="55" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">错误：指令作用到别人</text><g transform="translate(1163,235) scale(0.8)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(1245,235) scale(0.8)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><line x1="1000" y1="296" x2="1400" y2="296" stroke="#cbdad5" stroke-width="3"/><line x1="1120" y1="143" x2="1172.0" y2="143.0" stroke="#2876a5" stroke-width="3"/><polygon points="1185,143 1172.0,149.0 1172.0,137.0" fill="#2876a5"/><line x1="1280" y1="143" x2="1228.0" y2="143.0" stroke="#ce7735" stroke-width="3"/><polygon points="1215,143 1228.0,137.0 1228.0,149.0" fill="#ce7735"/><text x="1200" y="338" font-size="26" fill="#b44a4a" font-weight="600" text-anchor="middle">画面流畅，也可能控制错人</text><text x="30" y="422" font-size="29" fill="#172e39" font-weight="400" text-anchor="start">这里的动作已知；要检验的是“哪个角色执行了哪条指令”。</text></svg>