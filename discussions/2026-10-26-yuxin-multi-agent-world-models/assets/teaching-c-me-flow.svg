<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 525" width="1440" height="525" role="img"><title>ME-World联合生成的输入、条件组织和多视角输出</title><desc>依据ME-World方法的自绘简图，省略内部层。开门仅作说明，不是论文实验。动作在目标视角中表达，共同环境历史参与联合生成，A/B保留不同视频输出。</desc><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}line,path,rect{stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><rect x="10" y="15" width="300" height="440" rx="14" fill="#f1f6f2" stroke="#cbdad5" stroke-width="2"/><text x="32" y="55" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">各自的观察与动作</text><rect x="32" y="85" width="256" height="62" rx="8" fill="#ffffff" stroke="#2876a5" stroke-width="2"/><text x="160.0" y="126.0" font-size="28" fill="#2876a5" font-weight="650" text-anchor="middle">A：当前视角＋开门</text><rect x="32" y="171" width="256" height="62" rx="8" fill="#ffffff" stroke="#ce7735" stroke-width="2"/><text x="160.0" y="212.0" font-size="28" fill="#ce7735" font-weight="650" text-anchor="middle">B：当前视角＋移动</text><text x="160" y="292" font-size="26" fill="#5b6d74" font-weight="400" text-anchor="middle">动作来自外部给定</text><g transform="translate(91,382) scale(0.65)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L59,-10 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(229,382) scale(0.65)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><line x1="316" y1="155" x2="332.0" y2="155.0" stroke="#39