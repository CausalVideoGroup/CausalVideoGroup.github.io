<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-label="teaching-b-cooperation.svg"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#61797e"/></marker></defs><rect width="1440" height="500" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif"><text x="30" y="45" font-size="31" fill="#172e39" font-weight="700" text-anchor="start">合作目标：把面包和盘子送到备餐台</text><rect x="30" y="68" width="433" height="293" rx="12" fill="#f7fafb" stroke="#d8e1df" stroke-width="2"/><rect x="60" y="98" width="373" height="60" rx="8" fill="#efe8da" stroke="#d3c7ad" stroke-width="2"/><text x="246.5" y="91" font-size="24" fill="#5b6d74" font-weight="600" text-anchor="middle">取物区</text><g transform="translate(159.9,130) scale(0.8)"><path d="M-30 10 L-30 -10 Q-45 -24 -26 -34 Q0 -51 26 -34 Q45 -24 30 -10 L30 10 Z" fill="#d9a05c" stroke="#99642f" stroke-width="3"/><path d="M-20 -12 Q0 -25 20 -12" fill="none" stroke="#fff2d8" stroke-width="5"/></g><g transform="translate(341.76,132) scale(0.8)"><ellipse rx="43" ry="18" fill="#eef6ff" stroke="#2876a5" stroke-width="4"/><ellipse rx="29" ry="10" fill="none" stroke="#98bcd5" stroke-width="3"/></g><g transform="translate(151.24,323) scale(0.72)"><circle cx="0" cy="-78" r="16" fill="#2876a5"/><path d="M0 -60 L0 -28 M0 -45 L-24 -33 M0 -45 L24 -33 M0 -28 L-18 0 M0 -28 L18 0" stroke="#2876a5" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#2876a5" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(346.09,323) scale(0.72)"><circle cx="0" cy="-78" r="16" fill="#ce7735"/><path d="M0 -60 L0 -28 M0 -45 L-24 -33 M0 -45 L24 -33 M0 -28 L-18 0 M0 -28 L18 0" stroke="#ce7735" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#ce7735" font-weight="700" text-anchor="middle">B</text></g><text x="246" y="408" font-size="28" fill="#172e39" font-weight="600" text-anchor="middle">我控制 A；B 独立行动</text><path d="M486 226 L543 226" fill="none" stroke="#5b6d74" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="568" y="68" width="370" height="293" rx="16" fill="#fff8ed" stroke="#d8e1df" stroke-width="2"/><text x="753" y="114" font-size="30" fill="#ce7735" font-weight="700" text-anchor="middle">对 B 的假设</text><g transform="translate(753,199) scale(1.15)"><path d="M-30 10 L-30 -10 Q-45 -24 -26 -34 Q0 -51 26 -34 Q45 -24 30 -10 L30 10 Z" fill="#d9a05c" stroke="#99642f" stroke-width="3"/><path d="M-20 -12 Q0 -25 20 -12" fill="none" stroke="#fff2d8" stroke-width="5"/></g><text x="753" y="265" font-size="28" fill="#ce7735" font-weight="600" text-anchor="middle">B 可能去拿面包</text><text x="753" y="317" font-size="25" fill="#5b6d74" font-weight="500" text-anchor="middle">根据观察推测，并非已知</text><path d="M957 226 L1011 226" fill="none" stroke="#5b6d74" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1039" y="45" font-size="31" fill="#172e39" font-weight="700" text-anchor="start">A 应该选择什么？</text><rect x="1040" y="68" width="368" height="128" rx="16" fill="#f1f7fc" stroke="#d8e1df" stroke-width="2"/><g transform="translate(1109,131) scale(0.86)"><path d="M-30 10 L-30 -10 Q-45 -24 -26 -34 Q0 -51 26 -34 Q45 -24 30 -10 L30 10 Z" fill="#d9a05c" stroke="#99642f" stroke-width="3"/><path d="M-20 -12 Q0 -25 20 -12" fill="none" stroke="#fff2d8" stroke-width="5"/></g><text x="1238" y="127" font-size="28" fill="#2876a5" font-weight="650" text-anchor="middle">也去拿面包</text><text x="1238" y="164" font-size="24" fill="#5b6d74" font-weight="500" text-anchor="middle">可能重复分工</text><rect x="1040" y="232" width="368" height="129" rx="16" fill="#f1f7fc" stroke="#d8e1df" stroke-width="2"/><g transform="translate(1109,292) scale(0.9)"><ellipse rx="43" ry="18" fill="#eef6ff" stroke="#2876a5" stroke-width="4"/><ellipse rx="29" ry="10" fill="none" stroke="#98bcd5" stroke-width="3"/></g><text x="1238" y="290" font-size="28" fill="#2876a5" font-weight="650" text-anchor="middle">转而去拿盘子</text><text x="1238" y="327" font-size="24" fill="#5b6d74" font-weight="500" text-anchor="middle">可能形成互补</text><text x="1219" y="408" font-size="28" fill="#172e39" font-weight="600" text-anchor="middle">需要比较共同后果</text><text x="1420" y="485" font-size="24" fill="#5b6d74" font-weight="500" text-anchor="end">原创教学示意 · 用于解释规划目标；不对应 COMBO 的具体实验轨迹</text></g></svg>