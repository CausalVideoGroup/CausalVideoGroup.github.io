<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-label="teaching-b-other-actions.svg"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#61797e"/></marker></defs><rect width="1440" height="500" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif"><rect x="12" y="10" width="423" height="445" rx="16" fill="#f5f9fc" stroke="#d8e1df" stroke-width="2"/><text x="35" y="53" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">刚才：双方动作都给定</text><rect x="35" y="74" width="177" height="44" rx="22" fill="#e6f1fb" stroke="none" stroke-width="2"/><text x="123.5" y="105" font-size="25" fill="#2876a5" font-weight="600" text-anchor="middle">A：向前</text><rect x="227" y="74" width="177" height="44" rx="22" fill="#fff1df" stroke="none" stroke-width="2"/><text x="315.5" y="105" font-size="25" fill="#ce7735" font-weight="600" text-anchor="middle">B：后退</text><rect x="45" y="143" width="350" height="232" rx="12" fill="#f7fafb" stroke="#d8e1df" stroke-width="2"/><path d="M63 333 L377 333" fill="none" stroke="#b9cecf" stroke-width="3" stroke-linecap="round"/><g transform="translate(192.0,320) scale(0.92)"><circle cx="0" cy="-78" r="16" fill="#2876a5"/><path d="M0 -60 L0 -28 M0 -45 L-22 -28 M0 -45 L40 -45 M0 -28 L-20 0 M0 -28 L22 0" stroke="#2876a5" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#2876a5" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(321.5,320) scale(0.92)"><circle cx="12" cy="-78" r="16" fill="#ce7735"/><path d="M9 -60 L0 -28 M5 -45 L-20 -35 M5 -45 L31 -26 M0 -28 L-18 0 M0 -28 L20 0" stroke="#ce7735" stroke-width="10" fill="none" stroke-linecap="round"/><text x="0" y="32" font-size="26" fill="#ce7735" font-weight="700" text-anchor="middle">B</text></g><path d="M272.5 170 L335.5 170" fill="none" stroke="#ce