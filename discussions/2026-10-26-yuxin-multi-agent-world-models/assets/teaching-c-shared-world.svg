<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" role="img"><title>一扇打开的门，在两个不同视角中保持同一状态</title><desc>自绘任务示意，不是论文实验。A开门后，A和B的画面不同，但门应同为打开状态。</desc><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}line,path,rect{stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><rect x="15" y="15" width="415" height="352" rx="14" fill="#f1f6f2" stroke="#cbdad5" stroke-width="2"/><text x="37" y="55" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">同一次事件：A开门</text><path d="M176.0,299 V146 H276.0 V299" fill="none" stroke="#5b6d74" stroke-width="5"/><path d="M176.0,146 L214.0,166 V287 L176.0,299 Z" fill="#d4e6dc" stroke="#398c77" stroke-width="3"/><g transform="translate(100,247) scale(0.8)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L59,-10 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(344,247) scale(0.8)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><line x1="151" y1="229" x2="171.0" y2="229.0" stroke="#2876a5" stroke-width="4"/><polygon points="184,229 171.0,235.0 171.0,223.0" fill="#2876a5"/><text x="221" y="345" font-size="28" fill="#398c77" font-weight="700" text-anchor="middle">门已经打开</text><line x1="445" y1="191" x2="467.0" y2="191.0" stroke="#398c77" stroke-width="4"/><polygon points="480,191 467.0,197.0 467.0,185.0" fill="#398c77"/><rect x="500" y="15" width="440" height="352" rx="14" fill="white" stroke="#2876a5" stroke-width="2"/><text x="522" y="55" font-size="30" fill="#2876a5" font-weight="700" text-anchor="start">A的视角</text><rect x="522" y="78" width="396" height="225" rx="10" fill="#f8fbf9" stroke="#2876a5" stroke-width="2"/><path d="M537,283 L652.6800000000001,222.0 H791.28 L903,283" fill="#eef3ef" stroke="#d6e1da" stroke-width="2"/><path d="M626.27,281 V151 H710.77 V281" fill="none" stroke="#5b6d74" stroke-width="5"/><path d="M626.27,151 L664.27,171 V269 L626.27,281 Z" fill="#d4e6dc" stroke="#398c77" stroke-width="3"/><g transform="translate(830.88,235.44) scale(0.68)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#ce7735" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#ce7735"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#ce7735"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">B</text></g><text x="720" y="344" font-size="27" fill="#5b6d74" font-weight="400" text-anchor="middle">看到门的一侧，以及B</text><rect x="980" y="15" width="440" height="352" rx="14" fill="white" stroke="#ce7735" stroke-width="2"/><text x="1002" y="55" font-size="30" fill="#ce7735" font-weight="700" text-anchor="start">B的视角</text><rect x="1002" y="78" width="396" height="225" rx="10" fill="#f8fbf9" stroke="#ce7735" stroke-width="2"/><path d="M1017,283 L1132.68,222.0 H1271.28 L1383,283" fill="#eef3ef" stroke="#d6e1da" stroke-width="2"/><g transform="translate(2510.88,0) scale(-1,1)"><path d="M1213.19,281 V151 H1297.69 V281" fill="none" stroke="#5b6d74" stroke-width="5"/><path d="M1213.19,151 L1251.19,171 V269 L1213.19,281 Z" fill="#d4e6dc" stroke="#398c77" stroke-width="3"/></g><g transform="translate(1101.0,235.44) scale(0.68)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><text x="1200" y="344" font-size="27" fill="#5b6d74" font-weight="400" text-anchor="middle">看到门的另一侧，以及A</text><rect x="15" y="389" width="1405" height="110" rx="12" fill="#eef6f0" stroke="#398c77" stroke-width="2"/><text x="42" y="432" font-size="31" fill="#398c77" font-weight="700" text-anchor="start">共同事实：同一扇门已经打开。</text><text x="42" y="476" font-size="28" fill="#172e39" font-weight="400" text-anchor="start">画面可以不同；若B的画面仍显示门关闭，就与同一次事件冲突。</text></svg>