<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 370" width="1440" height="370" role="img"><title>LAM task example</title><desc>Original teaching schematic; not a paper experiment.</desc><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}line,path,rect{stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="470" height="350" rx="14" fill="#f1f6f2" stroke="#cbdad5" stroke-width="2"/><text x="32" y="50" font-size="30" fill="#172e39" font-weight="700" text-anchor="start">观察到两帧：人向左移动</text><rect x="34" y="92" width="190" height="170" rx="14" fill="white" stroke="#cbdad5" stroke-width="2"/><rect x="252" y="92" width="200" height="170" rx="14" fill="white" stroke="#cbdad5" stroke-width="2"/><g transform="translate(154,183) scale(0.65)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><g transform="translate(320,183) scale(0.65)" opacity="1"><path d="M-25,-5 L-45,18 M25,-5 L45,18 M-13,35 L-19,67 M13,35 L19,67" fill="none" stroke="#2876a5" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="-49" r="22" fill="#2876a5"/><rect x="-28" y="-21" width="56" height="62" rx="16" fill="#2876a5"/><text x="0" y="20" font-size="28" fill="white" font-weight="700" text-anchor="middle">A</text></g><text x="126" y="302" font-size="28" fill="#5b6d74" font-weight="400" text-anchor="middle">当前帧</text><text x="352" y="302" font-size="28" fill="#5b6d74" font-weight="400" text-anchor="middle">后续帧</text><line x1="225" y1="177" x2="236.0" y2="177.0" stroke="#5b6d74" stroke-width="3"/><polygon points="249,177 236.0,183.0 236.0,171.0" fill="#5b6d74"/><line x1="492" y1="185" x2="527.0" y2="185.0" stroke="#5b6d74" st